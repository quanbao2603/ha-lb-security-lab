# Keepalived VRRP unicast config - BACKUP firewall. Keepalived owns VIPs only; nftables owns filtering.
# Secrets Policy: NO secrets in this file (no auth_pass; lab segments are isolated host-only).
global_defs {
    router_id firewall-b
    enable_script_security
    script_user root
}

vrrp_script chk_firewall {
    script "/etc/keepalived/keepalived-healthcheck.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_10 {
    state BACKUP
    interface eth0
    virtual_router_id 10
    priority 100
    advert_int 1
    garp_master_repeat 3
    garp_master_delay 1
    unicast_src_ip 172.20.10.3
    unicast_peer {
        172.20.10.2
    }
    virtual_ipaddress {
        172.20.10.1/24 dev eth0
    }
    track_script {
        chk_firewall
    }
}

