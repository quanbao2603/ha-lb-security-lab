#!/usr/sbin/nft -f
# ==============================================================================
# Shared Cybersecurity HA Lab — Firewall Configuration (nftables)
# Owner: Minh Hung (Firewall-A / Firewall-B)
# Design Reference: lab-v2.html & lab/firewall/firewall-rule-matrix.md
# Security Posture: Deny-by-default, Anti-spoofing, VIP-only DNAT, Full Logging
# Secrets Policy: NO secrets, tokens, or private keys in this file.
# ponytail: static ruleset + kernel log prefixes for 7-day lab; upgrade to VRRP + conntrackd state sync when running active/passive HA continuously
# ==============================================================================

flush ruleset

# ------------------------------------------------------------------------------
# 1. Network Zones, Interfaces & Host Definitions
# ------------------------------------------------------------------------------
define WAN_IF       = "eth0"
define DMZ_IF       = "eth1"
define APP_IF       = "eth2"
define DB_IF        = "eth3"
define MGMT_IF      = "eth4"

define WAN_NET      = 172.20.10.0/24
define DMZ_NET      = 172.20.20.0/24
define APP_NET      = 172.20.30.0/24
define DB_NET       = 172.20.40.0/24
define MGMT_NET     = 172.20.50.0/24

define FW_WAN_IP    = 172.20.10.1
define VIP_LB       = 172.20.20.100
define LB_NODES     = { 172.20.20.10, 172.20.20.11 }
define WEB_NODES    = { 172.20.20.21, 172.20.20.22 }
define TRANSIT_VMS  = { 172.20.20.5, 172.20.20.6 }

define DB_PRIMARY   = 172.20.40.11
define DB_REPLICA   = 172.20.40.12
define DB_NODES     = { 172.20.40.11, 172.20.40.12 }

define LOG_MONITOR  = 172.20.50.10
define INTERNAL_ALL = { 172.20.10.0/24, 172.20.20.0/24, 172.20.30.0/24, 172.20.40.0/24, 172.20.50.0/24 }

# ------------------------------------------------------------------------------
# 2. Filter Table (Deny-by-default for Input & Forward)
# ------------------------------------------------------------------------------
table inet filter {

    # --- Anti-Spoofing & Pre-routing Sanity Checks ---
    chain prerouting {
        type filter hook prerouting priority raw; policy accept;

        # Drop non-loopback packets spoofing 127.0.0.0/8
        iifname != "lo" ip saddr 127.0.0.0/8 limit rate 10/minute log prefix "[FW-DENY-SPOOF] " counter drop

        # Anti-spoofing on WAN interface: WAN must only originate from WAN_NET (172.20.10.0/24)
        iifname $WAN_IF ip saddr != $WAN_NET limit rate 10/minute log prefix "[FW-DENY-SPOOF] " counter drop

        # Anti-spoofing on internal interfaces: prevent zone cross-spoofing
        iifname $DMZ_IF ip saddr != $DMZ_NET limit rate 10/minute log prefix "[FW-DENY-SPOOF] " counter drop
        iifname $APP_IF ip saddr != $APP_NET limit rate 10/minute log prefix "[FW-DENY-SPOOF] " counter drop
        iifname $DB_IF ip saddr != $DB_NET limit rate 10/minute log prefix "[FW-DENY-SPOOF] " counter drop
        iifname $MGMT_IF ip saddr != $MGMT_NET limit rate 10/minute log prefix "[FW-DENY-SPOOF] " counter drop
    }

    # --- Traffic Destined to the Firewall Host Itself ---
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow loopback
        iifname "lo" accept

        # Allow established/related sessions; drop invalid packets with log
        ct state established,related accept
        ct state invalid limit rate 10/minute log prefix "[FW-DENY-INVALID] " counter drop

        # Explicitly block and log SSH attempts from WAN-LAB to Firewall
        ip saddr $WAN_NET tcp dport 22 log prefix "[FW-DENY-WAN-SSH] " counter drop

        # MGMT (172.20.50.0/24) -> Firewall SSH (22/TCP, SSH key-only enforced by sshd_config)
        ip saddr $MGMT_NET tcp dport 22 ct state new log prefix "[FW-ALLOW-MGMT-SSH:] " counter accept

        # Allow limited ICMP echo-request from MGMT and DMZ/DB gateways for diagnostics
        ip saddr { $MGMT_NET, $DMZ_NET, $DB_NET } ip protocol icmp icmp type echo-request limit rate 5/second log prefix "[FW-ALLOW-ICMP-IN] " counter accept

        # Default DENY + LOG for any other input traffic
        limit rate 20/minute burst 40 packets log prefix "[FW-DENY-INPUT-DEFAULT] " flags all counter drop
        counter drop
    }

    # --- Routed Traffic Across Security Zones (Core Policy Boundary) ---
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Stateful inspection: allow established/related; drop invalid packets
        ct state established,related accept
        ct state invalid limit rate 10/minute log prefix "[FW-DENY-INVALID] " counter drop

        # ======================================================================
        # EXPLICIT NEGATIVE RULES (WAN-LAB Direct Access Prevention + Logging)
        # ======================================================================

        # FW-02: WAN-LAB -> Web-A/B direct (Bypass VIP attempt) -> DENY + LOG
        ip saddr $WAN_NET ip daddr $WEB_NODES log prefix "[FW-DENY-WAN-DIRECT:WEB] " counter drop

        # FW-03: WAN-LAB -> DATABASE (172.20.40.0/24) -> DENY + LOG
        ip saddr $WAN_NET ip daddr $DB_NET log prefix "[FW-DENY-WAN-DIRECT:DB] " counter drop

        # FW-04a: WAN-LAB -> MGMT (172.20.50.0/24) -> DENY + LOG
        ip saddr $WAN_NET ip daddr $MGMT_NET log prefix "[FW-DENY-WAN-DIRECT:MGMT] " counter drop

        # FW-04b: WAN-LAB -> APP (172.20.30.0/24) -> DENY + LOG
        ip saddr $WAN_NET ip daddr $APP_NET log prefix "[FW-DENY-WAN-DIRECT:APP] " counter drop

        # ======================================================================
        # EXPLICIT POSITIVE RULES (Least-Privilege ALLOW + Logging)
        # ======================================================================

        # FW-01: WAN-LAB (172.20.10.0/24) -> VIP (172.20.20.100) port 80, 443/TCP -> ALLOW + LOG
        ip saddr $WAN_NET ip daddr $VIP_LB tcp dport { 80, 443 } ct state new log prefix "[FW-ALLOW-WAN-VIP:] " counter accept

        # FW-05: LB-A/B (172.20.20.10, .11) -> Web-A/B (172.20.20.21, .22) port 80/TCP -> ALLOW + LOG
        ip saddr $LB_NODES ip daddr $WEB_NODES tcp dport 80 ct state new log prefix "[FW-ALLOW-LB-WEB:] " counter accept

        # FW-06: Web-A/B (172.20.20.21, .22) -> DB-Primary/Replica (172.20.40.11, .12) port 5432/TCP -> ALLOW + LOG
        # Note: In week-1 baseline, Web-A/B act as minimal app nodes; APP_NET is reserved for post-baseline expansion.
        ip saddr $WEB_NODES ip daddr $DB_NODES tcp dport 5432 ct state new log prefix "[FW-ALLOW-WEB-DB:] " counter accept

        # FW-07: DB-Primary (172.20.40.11) <-> DB-Replica (172.20.40.12) port 5432/TCP -> ALLOW + LOG
        ip saddr $DB_PRIMARY ip daddr $DB_REPLICA tcp dport 5432 ct state new log prefix "[FW-ALLOW-DB-REPL:] " counter accept
        ip saddr $DB_REPLICA ip daddr $DB_PRIMARY tcp dport 5432 ct state new log prefix "[FW-ALLOW-DB-REPL:] " counter accept

        # FW-08: MGMT (172.20.50.0/24) -> Linux VMs port 22/TCP (SSH key-only on hosts) -> ALLOW + LOG
        ip saddr $MGMT_NET ip daddr $INTERNAL_ALL tcp dport 22 ct state new log prefix "[FW-ALLOW-MGMT-SSH:] " counter accept

        # FW-09: Internal Linux VMs -> Log-Monitor (172.20.50.10) port 514/UDP,TCP (Syslog) -> ALLOW + LOG
        ip saddr { $DMZ_NET, $DB_NET, $MGMT_NET } ip daddr $LOG_MONITOR meta l4proto { tcp, udp } th dport 514 ct state new log prefix "[FW-ALLOW-SYSLOG] " counter accept

        # Diagnostics: MGMT & DMZ Transit/Web -> Internal VMs ICMP ping -> ALLOW + LOG
        ip saddr { $MGMT_NET, $DMZ_NET } ip daddr { $DMZ_NET, $DB_NET, $MGMT_NET } ip protocol icmp icmp type echo-request limit rate 5/second log prefix "[FW-ALLOW-MGMT-ICMP] " counter accept

        # ======================================================================
        # FW-99: DEFAULT DENY + LOG (Catch-all at end of forward chain)
        # ======================================================================
        limit rate 30/minute burst 60 packets log prefix "[FW-DEFAULT-DENY:] " flags all counter drop
        counter drop
    }

    # --- Outbound Traffic Originating from the Firewall Host ---
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# ------------------------------------------------------------------------------
# 3. NAT Table (Port-Forwarding Strictly Limited to VIP 80/443)
# ------------------------------------------------------------------------------
table ip nat {

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Restricted DNAT: If WAN-LAB clients hit the Firewall WAN IP (172.20.10.1) on 80/443,
        # forward ONLY to the HAProxy VIP (172.20.20.100). Never DNAT to Web/DB/MGMT nodes.
        iifname $WAN_IF ip saddr $WAN_NET ip daddr $FW_WAN_IP tcp dport { 80, 443 } log prefix "[FW-NAT-DNAT-VIP] " counter dnat to 172.20.20.100
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
    }
}
