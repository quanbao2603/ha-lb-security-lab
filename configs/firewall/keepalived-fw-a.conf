# Keepalived VRRP unicast config - MASTER firewall. Keepalived owns VIPs only; nftables owns filtering.
# Secrets Policy: NO secrets in this file (no auth_pass; lab segments are isolated host-only).
global_defs {
    router_id firewall-a
    enable_script_security
    script_user root
}

vrrp_script chk_firewall {
    script "/usr/local/sbin/keepalived-healthcheck.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
}

vrrp_sync_group VG_FW {
    group {
        VI_10
        VI_20
        VI_30
        VI_40
        VI_50
    }
}

vrrp_instance VI_10 {
    state MASTER
    interface eth0
    virtual_router_id 10
    priority 150
    advert_int 1
    garp_master_repeat 3
    garp_master_delay 1
    unicast_src_ip 172.20.10.2
    unicast_peer {
        172.20.10.3
    }
    virtual_ipaddress {
        172.20.10.1/24 dev eth0
    }
    track_script {
        chk_firewall
    }
}

