# /etc/rsyslog.d/10-rsyslog-central.conf
# Cấu hình rsyslog tập trung trên Log-Monitor (172.20.50.10)
# Nhận syslog từ Firewall, DB, Transit, LB, Web và tách file theo hostname
# ponytail: plain UDP/TCP 514 ceiling inside isolated lab VLANs; upgrade to RELP + mTLS (imrelp) when crossing untrusted links.

module(load="imudp")
module(load="imtcp")

# Chỉ cho phép nhận log từ các subnet nội bộ của Lab (Transit, DMZ/LB, Web/App, DB, Mgmt)
$AllowedSender UDP, 127.0.0.1, 172.20.10.0/24, 172.20.20.0/24, 172.20.30.0/24, 172.20.40.0/24, 172.20.50.0/24
$AllowedSender TCP, 127.0.0.1, 172.20.10.0/24, 172.20.20.0/24, 172.20.30.0/24, 172.20.40.0/24, 172.20.50.0/24

# Template tách thư mục và file theo HOSTNAME và chương trình gửi log
template(
    name="RemoteByHostnameFile"
    type="string"
    string="/var/log/central/%HOSTNAME%/%PROGRAMNAME%.log"
)

# Ruleset xử lý riêng cho luồng log tập trung (ngăn path traversal trong HOSTNAME)
ruleset(name="CentralLabLogs") {
    if ($hostname contains ".." or $hostname contains "/") then {
        stop
    }
    action(
        type="omfile"
        dynaFile="RemoteByHostnameFile"
        dirCreateMode="0750"
        fileCreateMode="0640"
        dynaFileCacheSize="32"
        asyncWriting="on"
    )
    stop
}

# Bind đúng địa chỉ IP của Log-Monitor (172.20.50.10)
input(type="imudp" address="172.20.50.10" port="514" ruleset="CentralLabLogs")
input(type="imtcp" address="172.20.50.10" port="514" ruleset="CentralLabLogs")
