global
    log /dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web_http
    bind 172.20.21.100:80
    default_backend web_backend

frontend web_https
    bind 172.20.21.100:443 ssl crt /etc/haproxy/lab.pem
    default_backend web_backend

backend web_backend
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server web-a 172.20.21.20:80 check
    server web-b 172.20.21.30:80 check

listen stats
    bind 172.20.21.10:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    # Mat khau stats dat cuc bo tren LB-A, KHONG commit. Thay bang gia tri that khi trien khai.
    # Tranh ky tu '#' trong mat khau (HAProxy hieu la comment).
    stats auth admin:__REDACTED_SET_LOCALLY__