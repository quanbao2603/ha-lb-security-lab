# File nay duoc Ansible tu doc khi lenh chay TREN THU MUC REPO.
# Vi vay luon goi tu goc repo (hoac cd vao repo trong WSL2), neu khong
# ProxyJump bi bo qua va ban se thay loi "unreachable" kho hieu.

[defaults]
inventory              = inventory/lab.ini
roles_path             = ansible/roles
collections_path       = ~/.ansible/collections
host_key_checking      = False
retry_files_enabled    = False
forks                  = 10
timeout                = 30
interpreter_python     = auto_silent
gathering              = smart
display_skipped_hosts  = False
stdout_callback        = default
callbacks_enabled      =

[ssh_connection]
# ---- Ly do dong duoi ----
# May Bao KHONG route thang duoc vao cac vmnet rieng cua may Hung.
# Host Windows cua Hung co adapter tren tung vmnet, nen no dong vai tro jump hop.
# ProxyJump mo ket noi TCP TU host den VM - khong can route, khong can IP forwarding.
#
# ---- Dieu KIENG ----
# Dung OpenSSH Server tren Windows cua Hung (khong dung Tailscale SSH cho vai jump:
# ho tro -W/ProxyJump khong on dinh). Tat key expiry Tailscale:
#   tailscale set --expiry=0   (ca hai may, ngay 1)
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ProxyJump=hung@100.64.x.x

# Pipelining giam so phan khoi SSH => nhanh hon nhieu khi chay 12 VM qua jump hop.
# Yeu cau: requiretty tat tren cac VM (mac dinh Debian thi dung).
pipelining       = True
control_path     = ~/.ansible/cp/%%h-%%r
retries          = 2
# private_key_file = ~/.ssh/id_ed25519_lab
